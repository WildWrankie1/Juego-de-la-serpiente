<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Neon Edition 🐍✨</title>
    <style>
        /* 🌌 Fondo futurista */
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle, #1a1a2e 0%, #0f0f1a 100%);
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow: hidden;
            touch-action: manipulation; 
        }

        /* 🏆 Contenedor del Marcador y Botón Pausa */
        .score-container {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 15px;
            text-transform: uppercase;
            text-shadow: 0 0 10px #00fff2;
            color: #00fff2;
        }

        /* Botón de Pausa Estilizado ⏸️ */
        #pauseBtn {
            background: none;
            border: 2px solid #ff0055;
            color: #ff0055;
            border-radius: 8px;
            padding: 2px 8px;
            cursor: pointer;
            font-size: 16px;
            margin-left: 20px;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.2);
            transition: background-color 0.1s, transform 0.1s;
        }
        #pauseBtn:active {
            background-color: #ff0055;
            color: #fff;
            box-shadow: 0 0 20px #ff0055;
            transform: scale(0.9);
        }

        /* 🎮 El Lienzo Ajustado */
        canvas {
            background-color: #05050a;
            border: 4px solid #00ff88;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.4);
            max-width: 85vw; 
            max-height: 85vw;
        }

        /* 🕹️ Cruceta de Controles Ergonómica */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 85px); 
            grid-template-rows: repeat(3, 85px);    
            gap: 12px;                              
            margin-top: 25px;
            margin-bottom: 20px;                    
        }

        .btn {
            background-color: rgba(5, 5, 10, 0.85);
            border: 2.5px solid #00fff2;
            border-radius: 20px;                    
            color: #00fff2;
            font-size: 28px;                        
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 255, 242, 0.2);
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.1s, transform 0.05s;
        }

        .btn:active {
            background-color: #00fff2;
            color: #05050a;
            box-shadow: 0 0 25px #00fff2;
            transform: scale(0.95);                 
        }

        #btn-up    { grid-column: 2; grid-row: 1; }
        #btn-left  { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down  { grid-column: 2; grid-row: 3; }

        .instructions {
            margin-top: 10px;
            font-size: 12px;
            color: #555;
            text-align: center;
        }
        @media (max-width: 600px) {
            .instructions { display: none; }
        }
    </style>
</head>
<body>

    <div class="score-container">
        <span>Puntos: <span id="scoreText">0</span></span>
        <button id="pauseBtn" onclick="togglePausa()">⏸️</button>
    </div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <div class="controls">
        <div class="btn" id="btn-up" onclick="cambiarDireccion('ArrowUp')">🔼</div>
        <div class="btn" id="btn-left" onclick="cambiarDireccion('ArrowLeft')">◀️</div>
        <div class="btn" id="btn-right" onclick="cambiarDireccion('ArrowRight')">▶️</div>
        <div class="btn" id="btn-down" onclick="cambiarDireccion('ArrowDown')">🔽</div>
    </div>
    
    <div class="instructions">Flechas para mover | Espacio para iniciar/reiniciar | P para Pausa</div>

    <script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreText = document.getElementById('scoreText');

let snake = [
    { x: 160, y: 160 },
    { x: 140, y: 160 },
    { x: 120, y: 160 }
];

let apple = { x: 300, y: 200 };
let dx = 20;
let dy = 0;
let actualDx = 20;
let actualDy = 0;
let puntuacion = 0;

let estadoJuego = 'INICIO';
let audioCtx = null;

const VELOCIDAD_INICIAL = 130;
let velocidadActual = VELOCIDAD_INICIAL;

let tablaPosiciones = localStorage.getItem('snakeLeaderboard_v2') 
    ? JSON.parse(localStorage.getItem('snakeLeaderboard_v2')) 
    : [
        { name: "FRANCI", score: 50 },
        { name: "SNAKE",  score: 40 },
        { name: "CYBER",  score: 30 },
        { name: "PLAYER", score: 20 },
        { name: "NEWBIE", score: 10 }
      ];

function iniciarAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function sonarComer() {
    iniciarAudio();
    if (!audioCtx) return;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
    osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.06);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
}

function sonarGameOver() {
    iniciarAudio();
    if (!audioCtx) return;
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(250, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
}

function bucleJuego() {
    mostrarJuego();
    setTimeout(bucleJuego, velocidadActual);
}
bucleJuego();

document.addEventListener('keydown', cambiarDireccion);

function mostrarJuego() {
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#05050a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    dibujarManzana();
    dibujarSerpiente();

    if (estadoJuego === 'INICIO') {
        dibujarPantallaInicio();
        return; 
    }

    if (estadoJuego === 'PAUSA') {
        dibujarPantallaPausa();
        return; 
    }

    if (estadoJuego === 'GAMEOVER') {
        dibujarPantallaGameOver();
        return; 
    }

    actualDx = dx;
    actualDy = dy;
    
    let newX = snake[0].x + dx;
    let newY = snake[0].y + dy;

    if (newX < 0 || newX >= 400 || newY < 0 || newY >= 400 || chocoConsigoMisma(newX, newY)) {
        sonarGameOver();
        estadoJuego = 'GAMEOVER'; 
        verificarYGuardarRecord(); 
        return; 
    }

    snake.unshift({ x: newX, y: newY });

    if (newX === apple.x && newY === apple.y) {
        puntuacion += 10;
        scoreText.innerText = puntuacion;
        sonarComer();
        
        let manzanasComidas = puntuacion / 10;
        velocidadActual = Math.max(60, VELOCIDAD_INICIAL - (Math.floor(manzanasComidas / 3) * 8));
        
        generarNuevaManzana();
    } else {
        snake.pop();
    }
}

function dibujarManzana() {
    ctx.shadowBlur = 15;
    ctx.shadowColor = "#ff0055";
    ctx.fillStyle = "#ff0055";
    ctx.beginPath();
    ctx.arc(apple.x + 10, apple.y + 10, 9, 0, 2 * Math.PI);
    ctx.fill();
}

function dibujarSerpiente() {
    for (let i = 0; i < snake.length; i++) {
        if (i === 0) {
            ctx.fillStyle = "#00fff2"; 
            ctx.shadowColor = "#00fff2";
        } else {
            let opacidad = 1 - (i / snake.length) * 0.65; 
            ctx.fillStyle = `rgba(0, 255, 136, ${opacidad})`;
            ctx.shadowColor = `rgba(0, 255, 136, ${opacidad})`;
        }
        ctx.shadowBlur = 15;
        ctx.fillRect(snake[i].x + 1, snake[i].y + 1, 18, 18);
    }
}

function dibujarPantallaInicio() {
    ctx.shadowBlur = 10;
    ctx.shadowColor = "#00fff2";
    ctx.fillStyle = "rgba(0, 255, 242, 0.12)";
    ctx.fillRect(40, 150, 320, 100);
    
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#00fff2";
    ctx.font = "bold 15px 'Segoe UI', Arial";
    ctx.textAlign = "center";
    ctx.fillText("PULSA ESPACIO O EL DPAD", canvas.width / 2, 195);
    ctx.fillText("PARA EMPEZAR EL JUEGO 🎮", canvas.width / 2, 225);
}

function dibujarPantallaPausa() {
    ctx.shadowBlur = 10;
    ctx.shadowColor = "#ff0055";
    ctx.fillStyle = "rgba(255, 0, 85, 0.15)";
    ctx.fillRect(90, 165, 220, 70);
    
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#ff0055";
    ctx.font = "bold 24px 'Segoe UI', Arial";
    ctx.textAlign = "center";
    ctx.fillText("JUEGO EN PAUSA", canvas.width / 2, 208);
}

function dibujarPantallaGameOver() {
    ctx.shadowBlur = 15;
    ctx.shadowColor = "#ff0055";
    ctx.fillStyle = "rgba(15, 10, 25, 0.92)";
    ctx.strokeStyle = "#ff0055";
    ctx.lineWidth = 3;
    ctx.fillRect(30, 20, 340, 360);
    ctx.strokeRect(30, 20, 340, 360);
    
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#ff0055";
    ctx.font = "bold 26px 'Segoe UI', Arial";
    ctx.textAlign = "center";
    ctx.fillText("¡GAME OVER! 😵", canvas.width / 2, 60);
    
    ctx.fillStyle = "#fff";
    ctx.font = "15px 'Segoe UI', Arial";
    ctx.fillText("Tu puntuación: " + puntuacion, canvas.width / 2, 90);
    
    ctx.fillStyle = "#ffaa00";
    ctx.font = "bold 16px 'Segoe UI', Arial";
    ctx.fillText("🏆 TOP 5 MEJORES JUGADORES 🏆", canvas.width / 2, 130);
    
    ctx.font = "bold 16px 'Courier New', Courier, monospace"; 
    ctx.textAlign = "left";
    
    for (let i = 0; i < 5; i++) {
        let jugador = tablaPosiciones[i] || { name: "------", score: 0 };
        let yPos = 170 + (i * 30);
        
        ctx.fillStyle = (jugador.score === puntuacion && jugador.score > 0) ? "#00fff2" : "#fff";
        
        let puesto = i + 1;
        let textoFila = `${puesto}. ${jugador.name.padEnd(7, '.')} ${String(jugador.score).padStart(4, '0')} PTS`;
        ctx.fillText(textoFila, canvas.width / 2 - 120, yPos); 
    }
    
    ctx.textAlign = "center";
    ctx.font = "italic 13px 'Segoe UI', Arial";
    ctx.fillStyle = "#777";
    ctx.fillText("Pulsa Espacio o el D-pad para reiniciar", canvas.width / 2, 355);
}

function verificarYGuardarRecord() {
    if (puntuacion > 0 && (tablaPosiciones.length < 5 || puntuacion >= tablaPosiciones[tablaPosiciones.length - 1].score)) {
        setTimeout(() => {
            let iniciales = prompt("¡ENTRASTE AL TOP 5! 👑\nIntroduce tu nombre (máx. 6 letras):");
            
            if (!iniciales) iniciales = "PLAYER";
            iniciales = iniciales.substring(0, 6).toUpperCase(); 
            
            tablaPosiciones.push({ name: iniciales, score: puntuacion });
            tablaPosiciones.sort((a, b) => b.score - a.score);
            tablaPosiciones = tablaPosiciones.slice(0, 5);
            
            localStorage.setItem('snakeLeaderboard_v2', JSON.stringify(tablaPosiciones));
            
            mostrarJuego();
        }, 80);
    }
}

// 🎮 CONTROLADOR DE DIRECCIÓN CON FILTRADO DE ENTRADA INTELIGENTE
function cambiarDireccion(elemento) {
    // Si es un evento de teclado, extrae la tecla; si es texto del botón móvil, usa el string directo
    const tecla = typeof elemento === 'string' ? elemento : elemento.key;

    // 🔄 REINICIO INTEGRADO (Desde la pantalla de GameOver)
    if (estadoJuego === 'GAMEOVER') {
        // Solo reacciona si pulsas la barra espaciadora (' ') o botones de dirección
        if (tecla === ' ' || ['ArrowLeft', 'ArrowUp', 'ArrowRight', 'ArrowDown'].includes(tecla)) {
            reiniciarJuego();
            estadoJuego = 'JUGANDO';
        }
        return;
    }

    // 🚀 INICIO INTEGRADO (Desde la pantalla de bienvenida)
    if (estadoJuego === 'INICIO') {
        // Solo reacciona si pulsas la barra espaciadora (' ') o botones de dirección
        if (tecla === ' ' || ['ArrowLeft', 'ArrowUp', 'ArrowRight', 'ArrowDown'].includes(tecla)) {
            iniciarAudio();
            estadoJuego = 'JUGANDO';
        }
        return;
    }

    if (tecla === 'p' || tecla === 'P' || tecla === 'Escape') {
        togglePausa();
        return;
    }

    if (estadoJuego === 'PAUSA') return;

    if (tecla === 'ArrowLeft' && actualDx === 0)  { dx = -20; dy = 0; }
    if (tecla === 'ArrowUp' && actualDy === 0)    { dx = 0;   dy = -20; }
    if (tecla === 'ArrowRight' && actualDx === 0) { dx = 20;  dy = 0; }
    if (tecla === 'ArrowDown' && actualDy === 0)  { dx = 0;   dy = 20; }
}

function togglePausa() {
    if (estadoJuego === 'INICIO' || estadoJuego === 'GAMEOVER') return; 
    iniciarAudio();
    
    if (estadoJuego === 'JUGANDO') {
        estadoJuego = 'PAUSA';
        document.getElementById('pauseBtn').innerText = "▶️"; 
    } else if (estadoJuego === 'PAUSA') {
        estadoJuego = 'JUGANDO';
        document.getElementById('pauseBtn').innerText = "⏸️"; 
    }
}

function chocoConsigoMisma(x, y) {
    for (let i = 1; i < snake.length; i++) {
        if (x === snake[i].x && y === snake[i].y) return true;
    }
    return false;
}

function generarNuevaManzana() {
    let encimaDeLaSerpiente = true;
    while (encimaDeLaSerpiente) {
        apple.x = Math.floor(Math.random() * 20) * 20;
        apple.y = Math.floor(Math.random() * 20) * 20;
        encimaDeLaSerpiente = false;
        for (let i = 0; i < snake.length; i++) {
            if (apple.x === snake[i].x && apple.y === snake[i].y) {
                encimaDeLaSerpiente = true;
                break;
            }
        }
    }
}

function reiniciarJuego() {
    puntuacion = 0;
    velocidadActual = VELOCIDAD_INICIAL;
    scoreText.innerText = puntuacion;
    document.getElementById('pauseBtn').innerText = "⏸️";
    snake = [
        { x: 160, y: 160 },
        { x: 140, y: 160 },
        { x: 120, y: 160 }
    ];
    dx = 20;
    dy = 0;
    generarNuevaManzana();
}
    </script>
</body>
</html>
