<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de la Serpiente 🐍</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle, #1a1a2e 0%, #0f0f1a 100%);
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow: hidden;
        }

        /* 🏆 Contenedor del Marcador exterior */
        .score-container {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-transform: uppercase;
            text-shadow: 0 0 10px #00fff2, 0 0 20px #00fff2;
            color: #00fff2;
        }

        /* 🎮 El Lienzo con un marco brillante de neón */
        canvas {
            background-color: #05050a;
            border: 4px solid #00ff88;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.5), 
                        inset 0 0 20px rgba(0, 255, 136, 0.2);
        }

        /* 💡 Pequeña nota de instrucciones estilizada */
        .instructions {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="score-container">Puntos: <span id="scoreText">0</span></div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <div class="instructions">Usa las flechas del teclado para dirigir la serpiente</div>

    <script>
// 🏁 Configuración inicial del lienzo (Canvas)
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// 📦 El cuerpo de la serpiente (Array de objetos)
let snake = [
    { x: 160, y: 160 },
    { x: 140, y: 160 },
    { x: 120, y: 160 }
];

// 🍎 Posición inicial de la manzana
let apple = { x: 300, y: 200 };

// 🏃‍♂️ Variables de velocidad inicial (Moviéndose a la derecha)
let dx = 20;
let dy = 0;
let actualDx = 20;
let actualDy = 0;
let puntuacion = 0;

// ⏱️ El bucle del juego: ejecuta 'mostrarJuego' cada 100 milisegundos
setInterval(mostrarJuego, 100);

// ⌨️ Escuchador de eventos para el teclado
document.addEventListener('keydown', cambiarDireccion);

// 🔄 FUNCIÓN PRINCIPAL (Game Loop)
function mostrarJuego() {

    actualDx = dx;
    actualDy = dy;
    
    // 1. Calcular la posición de la nueva cabeza 🆕
    let newX = snake[0].x + dx;
    let newY = snake[0].y + dy;

    // 2. Condicionales 'if' para Game Over (Paredes o morderse) 🛑
    if (newX < 0 || newX >= 400 || newY < 0 || newY >= 400 || chocoConsigoMisma(newX, newY)) {
        alert("¡Game Over! 😵 Puntuación final: " + puntuacion);
        reiniciarJuego();
        return; // Detiene la ejecución de este fotograma
    }

    // 3. Mover la serpiente en el array 🐍
    snake.unshift({ x: newX, y: newY }); // Añade la nueva cabeza adelante

    // Condicional 'if' para comer la manzana 🍎
    if (newX === apple.x && newY === apple.y) {
        puntuacion += 10;         // Sumamos 10 puntos
        scoreText.innerText = puntuacion;
        generarNuevaManzana(); // Si come, NO hace .pop() para que crezca
    } else {
        snake.pop(); // Si no come, se mueve normal quitando la cola vieja
    }

    // 🖌️ RENDERIZADO ESTILIZADO

    // 1. Fondo del Canvas (Efecto rejilla sutil de fondo de juego retro)
    ctx.shadowBlur = 0; // Reset de brillos para el fondo
    ctx.fillStyle = "#05050a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // 2. Dibujar la manzana con brillo de neón rojo 🍎
    ctx.shadowBlur = 15;
    ctx.shadowColor = "#ff0055";
    ctx.fillStyle = "#ff0055";
    // Dibujamos la manzana redonda en vez de un cuadrado tosco
    ctx.beginPath();
    ctx.arc(apple.x + 10, apple.y + 10, 9, 0, 2 * Math.PI);
    ctx.fill();

    // 3. Dibujar la serpiente con brillo neón verde 🐍
    ctx.shadowColor = "#00ff88";
    
    for (let i = 0; i < snake.length; i++) {
        ctx.shadowBlur = 15;
        
        if (i === 0) {
            // La cabeza tiene un color ligeramente más brillante/azul para diferenciarla
            ctx.fillStyle = "#00fff2"; 
            ctx.shadowColor = "#00fff2";
        } else {
            // El cuerpo es verde neón estándar
            ctx.fillStyle = "#00ff88";
            ctx.shadowColor = "#00ff88";
        }
        
        // Dibujamos los segmentos un pelín más pequeños (18px en espacio de 20px) 
        // para dejar una cuadrícula elegante entre ellos
        ctx.fillRect(snake[i].x + 1, snake[i].y + 1, 18, 18);
    }
}    
    

// 🎮 FUNCIÓN PARA CAMBIAR DE DIRECCIÓN
function cambiarDireccion(event) {
    // Evita que la serpiente gire 180 grados directamente sobre sí misma
    if (event.key === 'ArrowLeft' && actualDx === 0)  { dx = -20; dy = 0; }
    if (event.key === 'ArrowUp' && actualDy === 0)    { dx = 0;   dy = -20; }
    if (event.key === 'ArrowRight' && actualDx === 0) { dx = 20;  dy = 0; }
    if (event.key === 'ArrowDown' && actualDy === 0)  { dx = 0;   dy = 20; }
}

// 🧠 FUNCIONES AUXILIARES

// Revisa si la nueva cabeza toca algún segmento del cuerpo
function chocoConsigoMisma(x, y) {
    for (let i = 1; i < snake.length; i++) {
        if (x === snake[i].x && y === snake[i].y) {
            return true;
        }
    }
    return false;
}

// Genera una manzana en una posición aleatoria alineada a la cuadrícula de 20px
function generarNuevaManzana() {
    let encimaDeLaSerpiente = true;

    // Se repetirá una y otra vez MIENTRAS la manzana caiga encima del cuerpo
    while (encimaDeLaSerpiente) {
        // 1. Generamos una posición al azar
        apple.x = Math.floor(Math.random() * 20) * 20;
        apple.y = Math.floor(Math.random() * 20) * 20;

        // 2. Asumimos temporalmente que la posición es buena (falsa alarma)
        encimaDeLaSerpiente = false;

        // 3. Revisamos segmento por segmento si nuestra suposición era falsa
        for (let i = 0; i < snake.length; i++) {
            if (apple.x === snake[i].x && apple.y === snake[i].y) {
                encimaDeLaSerpiente = true; // ¡Ups! Sí cayó encima.
                break; // Rompe el 'for' para que el 'while' vuelva a generar otra coordenada
            }
        }
    }
}

// Restablece los valores iniciales para empezar de nuevo
function reiniciarJuego() {
    puntuacion = 0;
    snake = [
        { x: 160, y: 160 },
        { x: 140, y: 160 },
        { x: 120, y: 160 }
    ];
    dx = 20;
    dy = 0;
    generarNuevaManzana();
}
    </script>
    
</body>
</html>
