<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Neon Edition 🐍✨</title>
    <style>
        /* 🌌 Fondo futurista */
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle, #1a1a2e 0%, #0f0f1a 100%);
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow: hidden;
            touch-action: manipulation; 
        }

        /* 🏆 Contenedor del Marcador Doble */
        .score-container {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 15px;
            text-transform: uppercase;
            text-shadow: 0 0 10px #00fff2;
            color: #00fff2;
            text-align: center;
        }

        .high-score {
            color: #ffaa00;
            text-shadow: 0 0 10px #ffaa00;
            margin-left: 15px;
        }

        /* 🎮 El Lienzo Ajustado para Móviles */
        canvas {
            background-color: #05050a;
            border: 4px solid #00ff88;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.4);
            max-width: 85vw; 
            max-height: 85vw;
        }

        /* 🕹️ Cruceta de Controles Ergonómica */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 85px); 
            grid-template-rows: repeat(3, 85px);    
            gap: 12px;                              
            margin-top: 25px;
            margin-bottom: 20px;                    
        }

        .btn {
            background-color: rgba(5, 5, 10, 0.85);
            border: 2.5px solid #00fff2;
            border-radius: 20px;                    
            color: #00fff2;
            font-size: 28px;                        
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 255, 242, 0.2);
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.1s, transform 0.05s;
        }

        .btn:active {
            background-color: #00fff2;
            color: #05050a;
            box-shadow: 0 0 25px #00fff2;
            transform: scale(0.95);                 
        }

        #btn-up    { grid-column: 2; grid-row: 1; }
        #btn-left  { grid-column: 1; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }
        #btn-down  { grid-column: 2; grid-row: 3; }

        .instructions {
            margin-top: 10px;
            font-size: 12px;
            color: #555;
        }
        @media (max-width: 600px) {
            .instructions { display: none; }
        }
    </style>
</head>
<body>

    <div class="score-container">
        <span>Puntos: <span id="scoreText">0</span></span>
        <span class="high-score">🏆 Récord: <span id="highScoreText">0</span></span>
    </div>
    
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <div class="controls">
        <div class="btn" id="btn-up" onclick="cambiarDireccion('ArrowUp')">🔼</div>
        <div class="btn" id="btn-left" onclick="cambiarDireccion('ArrowLeft')">◀️</div>
        <div class="btn" id="btn-right" onclick="cambiarDireccion('ArrowRight')">▶️</div>
        <div class="btn" id="btn-down" onclick="cambiarDireccion('ArrowDown')">🔽</div>
    </div>
    
    <div class="instructions">Usa las flechas del teclado en PC</div>

    <script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreText = document.getElementById('scoreText');
const highScoreText = document.getElementById('highScoreText');

let snake = [
    { x: 160, y: 160 },
    { x: 140, y: 160 },
    { x: 120, y: 160 }
];

let apple = { x: 300, y: 200 };
let dx = 20;
let dy = 0;
let actualDx = 20;
let actualDy = 0;
let puntuacion = 0;

// 💾 CARGAR RÉCORD: Intenta buscar un récord guardado; si no existe, empieza en 0
let recordMaximo = localStorage.getItem('snakeHighScore') ? parseInt(localStorage.getItem('snakeHighScore')) : 0;
highScoreText.innerText = recordMaximo; // Lo muestra en la pantalla al cargar

// ⏱️ VELOCIDAD: Subido de 100ms a 130ms para que vaya un poco más lento al inicio
setInterval(mostrarJuego, 130);
document.addEventListener('keydown', cambiarDireccion);

function mostrarJuego() {
    actualDx = dx;
    actualDy = dy;
    
    let newX = snake[0].x + dx;
    let newY = snake[0].y + dy;

    if (newX < 0 || newX >= 400 || newY < 0 || newY >= 400 || chocoConsigoMisma(newX, newY)) {
        alert("¡Game Over! 😵 Puntuación final: " + puntuacion);
        reiniciarJuego();
        return;
    }

    snake.unshift({ x: newX, y: newY });

    if (newX === apple.x && newY === apple.y) {
        puntuacion += 10;
        scoreText.innerText = puntuacion;
        
        // 💾 COMPROBAR RÉCORD: Si superas la marca actual, se actualiza en vivo
        if (puntuacion > recordMaximo) {
            recordMaximo = puntuacion;
            highScoreText.innerText = recordMaximo;
            localStorage.setItem('snakeHighScore', recordMaximo); // Lo guarda en la memoria del navegador
        }
        
        generarNuevaManzana();
    } else {
        snake.pop();
    }

    // RENDERIZADO
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#05050a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Manzana 🍎
    ctx.shadowBlur = 15;
    ctx.shadowColor = "#ff0055";
    ctx.fillStyle = "#ff0055";
    ctx.beginPath();
    ctx.arc(apple.x + 10, apple.y + 10, 9, 0, 2 * Math.PI);
    ctx.fill();

    // Serpiente 🐍
    for (let i = 0; i < snake.length; i++) {
        if (i === 0) {
            ctx.fillStyle = "#00fff2"; 
            ctx.shadowColor = "#00fff2";
        } else {
            ctx.fillStyle = "#00ff88";
            ctx.shadowColor = "#00ff88";
        }
        ctx.fillRect(snake[i].x + 1, snake[i].y + 1, 18, 18);
    }
}

function cambiarDireccion(elemento) {
    const tecla = typeof elemento === 'string' ? elemento : elemento.key;

    if (tecla === 'ArrowLeft' && actualDx === 0)  { dx = -20; dy = 0; }
    if (tecla === 'ArrowUp' && actualDy === 0)    { dx = 0;   dy = -20; }
    if (tecla === 'ArrowRight' && actualDx === 0) { dx = 20;  dy = 0; }
    if (tecla === 'ArrowDown' && actualDy === 0)  { dx = 0;   dy = 20; }
}

function chocoConsigoMisma(x, y) {
    for (let i = 1; i < snake.length; i++) {
        if (x === snake[i].x && y === snake[i].y) return true;
    }
    return false;
}

function generarNuevaManzana() {
    let encimaDeLaSerpiente = true;
    while (encimaDeLaSerpiente) {
        apple.x = Math.floor(Math.random() * 20) * 20;
        apple.y = Math.floor(Math.random() * 20) * 20;
        encimaDeLaSerpiente = false;
        for (let i = 0; i < snake.length; i++) {
            if (apple.x === snake[i].x && apple.y === snake[i].y) {
                encimaDeLaSerpiente = true;
                break;
            }
        }
    }
}

function reiniciarJuego() {
    puntuacion = 0;
    scoreText.innerText = puntuacion;
    snake = [
        { x: 160, y: 160 },
        { x: 140, y: 160 },
        { x: 120, y: 160 }
    ];
    dx = 20;
    dy = 0;
    generarNuevaManzana();
}
    </script>
</body>
</html>
